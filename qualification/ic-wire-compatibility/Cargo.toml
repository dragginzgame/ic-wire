[package]
name = "ic-wire-compatibility"
autotests = false
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Independent codec contract qualification for Wire"

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
candid-comparison = ["dep:candid"]
typescript = [
    "wire/derive",
    "wire/platform-types",
    "dep:ic-wire-consumer",
    "ic-wire-consumer/schema",
]

[dependencies]
candid = { workspace = true, features = ["serde_bytes"], optional = true }
ic-wire-consumer = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
ic-platform-runtime = { workspace = true, features = ["system-raw"] }

[dev-dependencies]
ic-platform-types.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
stats_alloc.workspace = true
toko-tooling.workspace = true
wire.workspace = true

[[test]]
name = "compatibility"
path = "tests/compatibility_tests.rs"

[[test]]
name = "allocation"
path = "tests/allocation_tests.rs"
harness = false

[[test]]
name = "typescript"
path = "tests/typescript_tests.rs"
required-features = ["typescript"]

[[test]]
name = "codec_contracts"
path = "tests/codec_contract_tests.rs"

[[test]]
name = "candid_matrix"
path = "tests/candid_matrix.rs"
required-features = ["candid-comparison"]

[lints]
workspace = true

[[example]]
name = "numeric-bounded"
path = "examples/numeric/bounded.rs"
crate-type = ["cdylib"]

[[example]]
name = "numeric-ordinary"
path = "examples/numeric/ordinary.rs"
crate-type = ["cdylib"]

[[example]]
name = "numeric-packed"
path = "examples/numeric/packed.rs"
crate-type = ["cdylib"]

[[example]]
name = "numeric-candid"
path = "examples/numeric/candid.rs"
crate-type = ["cdylib"]
required-features = ["candid-comparison"]
