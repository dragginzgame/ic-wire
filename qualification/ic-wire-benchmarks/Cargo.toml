[package]
name = "ic-wire-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
autobenches = false

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
clap.workspace = true
dhat.workspace = true
# Testkit is used only by native tests/examples, never a canister library.
ic-testkit.workspace = true
stats_alloc.workspace = true
tokio.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "benchmarks"

[package.metadata.toko-tooling.loc.paths]
tools = "build_tooling"

[features]
wire = []
candid = []
allocations = []
heap = []
# Gate native simulator execution; its dependency is development-only.
ic = []
toko = []
# Focused ordinary-list/output-writer qualification, not a production mode.
hotspots = []
# Signed boundaries and container shapes, retaining ordinary and Packed controls.
signed32 = []
# Small paired regression corpus, never a production codec selection.
cost-smoke = []
# Fixed-width IDs versus an equally flattened external Candid blob.
id16 = []
id16-control = ["id16"]
# Real IC identities, wide records, large variants and ragged batches.
contract-shapes = []
# New boundary/stdlib controls; bulk is private research, never production.
coverage-shapes = []
# Existing Packed DTOs plus domain conversion; not another production codec.
packed-containers = ["coverage-shapes"]
# Public adapter qualification; never a production codec selection.
borrowed-containers = ["packed-containers"]
research-bulk = ["coverage-shapes"]
# Explicit standard byte-array map keys versus unchanged fixed-array controls.
byte-keys = []
byte-keys-control = ["byte-keys"]
# Qualification of caller storage, never a production codec selection.
caller-slice = []
caller-scoped = []
# Qualification-only ownership control; the wire representation is identical.
borrowed-input = []
# The same ownership probe through the optional generated endpoint integration.
endpoint-input = []
# Benchmark cohort selection, never a production codec mode.
packed-i16 = []
packed-i16-baseline = ["packed-i16"]
packed-scale = ["derive-scale"]
packed-scale-shared = ["packed-scale"]
# Bulk-field qualification cohorts; never a production codec selection.
bulk = []
bulk-baseline = []
bulk-scale = ["derive-scale"]
# Distinct records exercise public field adapters; DTO is the existing codec control.
adapter-scale = ["derive-scale", "ic-wire/typescript"]
adapter-scale-dto = ["adapter-scale"]
derive-scale = []
derive-scale-1 = ["derive-scale"]
derive-scale-10 = ["derive-scale"]

[dev-dependencies]
bytemuck.workspace = true
candid.workspace = true
ic-platform-runtime = { workspace = true, features = ["ic0"] }
ic-platform-types.workspace = true
ic-wire.workspace = true
# Only the endpoint-input example uses these exports; production packages are unaffected.
ic-wire-endpoint.workspace = true
# Candid Nat exposes a 0.4 BigUint; keep this approved exception dev-only.
# See the root selection and docs/benchmarks/evaluation.md#candid-bigint-type-identity.
num-bigint.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
toko-tooling.workspace = true

[[bench]]
name = "suite"
path = "benches/suite.rs"
harness = false
required-features = ["wire", "candid"]

[[example]]
name = "codec-wasm"
path = "benches/wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "codec-report"
path = "tools/report/mod.rs"

[[example]]
name = "codec-instructions"
path = "benches/instructions.rs"
required-features = ["wire", "candid", "ic"]

[[example]]
name = "caller-storage"
path = "benches/caller_storage/mod.rs"
crate-type = ["cdylib"]

[[example]]
name = "input-borrowing"
path = "benches/input_borrowing/mod.rs"
crate-type = ["cdylib"]

[[example]]
name = "admission-wasm"
path = "benches/admission_wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "admission-instructions"
path = "benches/admission_instructions.rs"
required-features = ["ic"]

# IC exports require unsafe attributes, but the fixture uses only safe system calls.
# Keep denial everywhere except the explicitly exported entrypoint.
[lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
