[workspace]
members = ["ic-wire-benchmarks", "ic-wire-endpoint-fixture", "ic-wire-qualification"]
resolver = "3"

[workspace.package]
version = "0.18.0"
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]

# Qualification dependencies
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
candid = { version = "0.10.40", default-features = false, features = ["bignum"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
dhat = "0.3.3"
ic-build = { version = "0.84.1", default-features = false }
ic-platform-runtime = { version = "0.22.1", default-features = false }
ic-platform-types = { version = "0.20.1", default-features = false }
ic-testkit = { version = "0.104.0", default-features = false }
# Current source under qualification; public release versions remain root-owned.
ic-wire = { path = "../crates/ic-wire" }
ic-wire-endpoint = { path = "../crates/ic-wire-endpoint" }
ic-wire-qualification = { path = "ic-wire-qualification" }
libfuzzer-sys = "0.4.13"
# Approved Candid Nat identity exception; see ../docs/benchmarks/evaluation.md.
num-bigint = "0.4.8"
serde = { version = "1.0", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
serde_json = "1.0"
sha2 = { version = "0.11.1", default-features = false }
stats_alloc = "0.1.10"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt", "time"] }
toko-tooling = "=0.43.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.benchmark-speed]
inherits = "evaluation"
opt-level = 3
