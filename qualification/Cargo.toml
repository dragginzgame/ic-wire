[workspace]
members = ["ic-wire-compatibility", "ic-wire-consumer"]
exclude = ["ic-instructions"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"

[workspace.dependencies]
ic-platform-runtime = { version = "0.23.11", default-features = false }
ic-platform-types = { version = "0.21.1", default-features = false }
ic-wire-consumer = { path = "ic-wire-consumer", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }
stats_alloc = "0.1.10"
toko-tooling = "=0.44.6"
wire = { package = "ic-wire", path = "../crates/ic-wire" }

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.wire-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.wire-speed]
inherits = "wire-size"
opt-level = 3
