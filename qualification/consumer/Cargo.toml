[package]
name = "ic-wire-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Standalone portable request/response consumer for Wire qualification"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "wire-consumer"
path = "src/bin/workload.rs"

[[bin]]
name = "wire-consumer-generate"
path = "src/bin/generate.rs"
required-features = ["schema"]

[features]
default = ["candidate"]
candidate = ["dep:candidate"]
reference = ["dep:reference"]
schema = ["candidate", "candidate/derive"]
ic = ["dep:ic-platform-runtime"]

[target.'cfg(target_family = "wasm")'.dependencies]
ic-platform-runtime = { workspace = true, optional = true, features = ["cdk"] }

[dependencies]
candidate = { workspace = true, optional = true }
reference = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true

[[example]]
name = "instruction-counter"
path = "src/ic.rs"
crate-type = ["cdylib"]
required-features = ["ic"]
