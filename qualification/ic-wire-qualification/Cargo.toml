[package]
name = "ic-wire-qualification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
autobenches = false

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
# Only the native diagnostic tool consumes Build.
ic-build.workspace = true
stats_alloc.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[package.metadata.toko-tooling.loc.paths]
benches = "benchmarks"
"benches/contract_tests.rs" = "tests"
tools = "build_tooling"

[lib]
path = "benches/mod.rs"

[features]
allocation-fixture = ["dep:ic-wire", "dep:serde_bytes"]
contract-fixture = ["dep:ic-wire", "dep:ic-platform-types"]
diagnostics = []
schema-fixture = ["contract-fixture", "ic-wire/typescript"]
schema-cost = ["schema-fixture"]
fuzz-runtime = ["dep:ic-wire", "dep:libfuzzer-sys"]

[dependencies]
ic-platform-types = { workspace = true, optional = true }
ic-wire = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libfuzzer-sys = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true
serde_json.workspace = true
sha2.workspace = true
toko-tooling.workspace = true

[[example]]
name = "check-contract"
path = "tools/check_contract/mod.rs"
required-features = ["schema-fixture"]
test = true

[[example]]
name = "check-diagnostics"
path = "tools/check_diagnostics/mod.rs"
required-features = ["diagnostics"]
test = true

[[example]]
name = "fuzz-runtime"
path = "tools/fuzz_runtime/mod.rs"
required-features = ["fuzz-runtime"]
test = false

[[example]]
name = "allocation"
path = "benches/allocation_driver/mod.rs"
required-features = ["allocation-fixture"]

[[example]]
name = "schema-cost"
path = "benches/schema_cost/mod.rs"
required-features = ["schema-cost"]

[[test]]
name = "packed-projection"
path = "tests/packed_projection/mod.rs"
required-features = ["allocation-fixture"]

[[test]]
name = "deferred-blob-ownership"
path = "tests/deferred_blob_ownership/mod.rs"
required-features = ["allocation-fixture"]

[lints]
workspace = true
