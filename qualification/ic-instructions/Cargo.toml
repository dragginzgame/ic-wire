[workspace]
members = ["driver"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../../LICENSE.md"

[workspace.dependencies]
ic-testkit = { version = "=0.106.0", default-features = false }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
toko-tooling = "=0.44.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
