[package]
name = "ic-wire"
description = "Bounded canonical Postcard contracts for controlled Internet Computer endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
typescript = ["dep:serde_json"]

[dependencies]
ic-wire-derive.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
libfuzzer-sys.workspace = true
serde_json.workspace = true

[[test]]
name = "runtime"
path = "tests/runtime/mod.rs"

[[test]]
name = "ui"
path = "tests/ui/mod.rs"

[[test]]
name = "native"
path = "tests/native/mod.rs"

[[example]]
name = "fuzz-runtime"
path = "examples/fuzz_runtime/mod.rs"
test = false

[[example]]
name = "typescript-conformance"
path = "examples/typescript_conformance/mod.rs"
required-features = ["typescript"]

[lints]
workspace = true
