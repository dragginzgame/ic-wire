[package]
name = "ic-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
repository.workspace = true
readme = "README.md"
description = "Bounded Serde/Postcard encoding with schema and TypeScript generation"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
service-client = ["typescript"]
api-manifest = ["typescript"]
platform-types = ["typescript", "dep:ic-platform-types"]
typescript = ["dep:serde_json"]

[dependencies]
bytemuck.workspace = true
ic-platform-types = { workspace = true, optional = true }
ic-wire-derive.workspace = true
postcard.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
