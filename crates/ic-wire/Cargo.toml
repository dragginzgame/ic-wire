[package]
name = "ic-wire"
description = "Unpublished investigation of bounded binary contracts for Rust IC applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
readme = "../../README.md"
publish = false

[features]
typescript = ["dep:serde_json"]

[dependencies]
ic-wire-derive.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
candid.workspace = true
ciborium.workspace = true
ic_principal.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "runtime"
path = "tests/runtime/mod.rs"

[[example]]
name = "codec-evaluation"
path = "examples/codec_evaluation/mod.rs"
test = true

[[example]]
name = "typed-journey"
path = "examples/typed_journey/mod.rs"
test = true

[[example]]
name = "typescript-conformance"
path = "examples/typescript_conformance/mod.rs"
required-features = ["typescript"]

[lints]
workspace = true
