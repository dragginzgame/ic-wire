[package]
name = "ic-wire"
version = "0.27.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = ["crates-io"]
repository.workspace = true
readme = "README.md"
description = "Bounded Serde/Postcard encoding with schema and TypeScript generation"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
api-manifest = ["typescript"]
platform-types = ["typescript", "dep:ic-platform-types"]
derive = ["typescript", "dep:ic-wire-derive"]
typescript = ["dep:serde_json"]

[dependencies]
bytemuck.workspace = true
ic-platform-types = { workspace = true, optional = true }
ic-wire-derive = { workspace = true, optional = true }
postcard.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
toko-tooling.workspace = true

[lints]
workspace = true
