[package]
name = "ic-wire-benchmarks"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
clap.workspace = true
dhat.workspace = true
ic-testkit.workspace = true

[features]
wire = []
candid = []
allocations = []
heap = []
ic = ["ic-platform/pocket-ic"]
toko = []
# Focused ordinary-list/output-writer qualification, not a production mode.
hotspots = []
# Qualification of caller storage, never a production codec selection.
caller-slice = []
caller-scoped = []
# Qualification-only ownership control; the wire representation is identical.
borrowed-input = []
# The same ownership probe through the optional generated endpoint integration.
endpoint-input = ["dep:ic-wire-endpoint"]
# Benchmark cohort selection, never a production codec mode.
packed-i16 = []
packed-i16-baseline = ["packed-i16"]
packed-scale = ["derive-scale"]
packed-scale-shared = ["packed-scale"]
# Bulk-field qualification cohorts; never a production codec selection.
bulk = []
bulk-baseline = []
bulk-scale = ["derive-scale"]
derive-scale = []
derive-scale-1 = ["derive-scale"]
derive-scale-10 = ["derive-scale"]

[dependencies]
# Only the explicit endpoint ownership probe selects runtime glue.
ic-wire-endpoint = { workspace = true, optional = true }

[dev-dependencies]
ic-platform = { workspace = true, features = ["candid", "ic0"] }
ic-wire.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
stats_alloc.workspace = true

[[bench]]
name = "suite"
path = "drivers/suite.rs"
harness = false
required-features = ["wire", "candid"]

[[example]]
name = "codec-wasm"
path = "drivers/wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "codec-report"
path = "examples/report/mod.rs"

[[example]]
name = "codec-instructions"
path = "drivers/instructions.rs"
required-features = ["wire", "candid", "ic"]

[[example]]
name = "caller-storage"
path = "examples/caller_storage/mod.rs"
crate-type = ["cdylib"]

[[example]]
name = "input-borrowing"
path = "examples/input_borrowing/mod.rs"
crate-type = ["cdylib"]

[[example]]
name = "admission-wasm"
path = "drivers/admission_wasm.rs"
crate-type = ["cdylib"]

[[example]]
name = "admission-instructions"
path = "drivers/admission_instructions.rs"
required-features = ["ic"]

# IC exports require unsafe attributes, but the fixture uses only safe system calls.
# Keep denial everywhere except the explicitly exported entrypoint.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[[test]]
name = "roundtrip"
path = "drivers/roundtrip.rs"
required-features = ["wire", "candid"]
