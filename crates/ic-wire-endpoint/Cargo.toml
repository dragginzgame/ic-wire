[package]
name = "ic-wire-endpoint"
description = "Typed IC Platform entrypoints for IC Wire contracts"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[features]
typescript = ["ic-wire/typescript", "dep:serde_json"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_json = { workspace = true, optional = true }

[dependencies]
ic-platform = { workspace = true, features = ["cdk"] }
ic-wire.workspace = true
ic-wire-derive = { workspace = true, features = ["endpoint"] }
serde.workspace = true

[lints]
workspace = true
