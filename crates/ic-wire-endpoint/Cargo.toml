[package]
name = "ic-wire-endpoint"
description = "Typed IC Platform entrypoints for IC Wire contracts"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "README.md", "Cargo.toml"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
typescript = ["ic-wire/typescript", "dep:serde_json"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_json = { workspace = true, optional = true }

[dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-wire.workspace = true
ic-wire-endpoint-macros.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
