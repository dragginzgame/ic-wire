[package]
name = "ic-wire-derive"
description = "Serde layout metadata derive for ic-wire"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "Cargo.toml"]

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
