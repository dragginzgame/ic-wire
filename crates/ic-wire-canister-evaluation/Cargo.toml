[package]
name = "ic-wire-canister-evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
cdk-fixture = ["dep:ic-wire", "dep:ic-wire-cdk"]
bindings = ["replay", "ic-wire/typescript"]
candid-codec = []
management = []
macro-fixture = ["dep:ic-wire", "dep:ic-wire-derive", "ic-wire-derive/adapter-fixture"]
replay = ["dep:ic-wire"]
runtime-benchmark = ["dep:ic-wire"]

[dependencies]
candid.workspace = true
ic-cdk.workspace = true
ic-wire = { workspace = true, optional = true }
ic-wire-cdk = { workspace = true, optional = true }
ic-wire-derive = { workspace = true, optional = true }
ic0.workspace = true
serde.workspace = true

[dev-dependencies]
ic-build.workspace = true
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-testkit.workspace = true
postcard.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[example]]
name = "runtime-measure"
path = "examples/runtime_measure/mod.rs"
required-features = ["runtime-benchmark"]

[[example]]
name = "browser-fixture"
path = "examples/browser_fixture/mod.rs"
required-features = ["bindings"]

[[example]]
name = "macro-fixture"
path = "examples/macro_fixture/mod.rs"
required-features = ["macro-fixture"]

[[example]]
name = "build-evaluation"
path = "examples/build_evaluation/mod.rs"

[[example]]
name = "cdk-fixture"
path = "examples/cdk_fixture/mod.rs"
required-features = ["cdk-fixture"]

[lints]
workspace = true

[[test]]
name = "macro-ui"
path = "tests/macro_ui/mod.rs"
required-features = ["macro-fixture"]
