[package]
name = "ic-wire-canister-evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bindings = ["replay", "ic-wire/typescript"]
candid-codec = []
management = []
peer = []
replay = ["dep:ic-wire"]

[dependencies]
candid.workspace = true
ic-cdk.workspace = true
ic-wire = { workspace = true, optional = true }
ic0.workspace = true
postcard.workspace = true
serde.workspace = true

[dev-dependencies]
pocket-ic.workspace = true
serde_json.workspace = true
sha2.workspace = true
wasmparser.workspace = true

[[example]]
name = "measure-canisters"
path = "examples/measure/mod.rs"

[[example]]
name = "replay-fixture"
path = "examples/replay_fixture/mod.rs"
required-features = ["replay"]

[[example]]
name = "browser-fixture"
path = "examples/browser_fixture/mod.rs"
required-features = ["bindings"]

[lints]
workspace = true
