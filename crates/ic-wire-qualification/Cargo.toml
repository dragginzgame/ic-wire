[package]
name = "ic-wire-qualification"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
allocation-fixture = ["dep:ic-wire", "dep:serde_bytes"]

[dependencies]
ic-wire = { workspace = true, optional = true }
