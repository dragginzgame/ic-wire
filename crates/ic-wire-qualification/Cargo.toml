[package]
name = "ic-wire-qualification"
version = "0.13.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
allocation-fixture = ["dep:ic-wire", "dep:serde_bytes"]
fuzz-runtime = ["dep:ic-wire", "dep:libfuzzer-sys"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libfuzzer-sys = { workspace = true, optional = true }

[dependencies]
ic-wire = { workspace = true, optional = true }
serde.workspace = true
serde_bytes = { workspace = true, optional = true }

[dev-dependencies]
clap.workspace = true
ic-build.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[example]]
name = "check-diagnostics"
path = "examples/check_diagnostics/mod.rs"

[[example]]
name = "fuzz-runtime"
path = "examples/fuzz_runtime/mod.rs"
required-features = ["fuzz-runtime"]
test = false

[[example]]
name = "allocation"
path = "examples/allocation/mod.rs"
required-features = ["allocation-fixture"]

[[test]]
name = "packed-projection"
path = "tests/packed_projection/mod.rs"
required-features = ["allocation-fixture"]

[lints]
workspace = true
