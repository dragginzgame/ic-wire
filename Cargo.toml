[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-canister-evaluation",
    "crates/ic-wire-derive",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.4.9"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Production dependencies
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.4.9" }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
syn = "3.0.9"

# Tests and tooling only
bitcode = "0.6.9"
ic-build = "0.22"
ic-wire = { path = "crates/ic-wire", version = "0.4.9" }
libfuzzer-sys = "0.4.13"
rmp-serde = "1.3.1"
serde_bytes = "0.11.19"
sha2 = "0.10.9"
wincode = "0.6.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
