[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-benchmarks",
    "crates/ic-wire-derive",
    "crates/ic-wire-qualification",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.7.8"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Production dependencies
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.7.8" }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }
serde_json = "1.0"
syn = { version = "3.0.9", features = ["visit"] }

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
dhat = "0.3.3"
ic-build = { version = "0.68.1", default-features = false }
ic-platform = { version = "0.6.15", default-features = false }
ic-testkit = { version = "0.68.1", default-features = false }
ic-wire = { path = "crates/ic-wire", version = "0.7.8" }
libfuzzer-sys = "0.4.13"
sha2 = "0.10.9"
stats_alloc = "0.1.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.benchmark-speed]
inherits = "evaluation"
opt-level = 3
