[workspace]
# Production packages: ic-wire, ic-wire-derive
# Tests and tooling packages: ic-wire-adapter-fixture, ic-wire-canister-evaluation
members = [
    "crates/ic-wire",
    "crates/ic-wire-adapter-fixture",
    "crates/ic-wire-canister-evaluation",
    "crates/ic-wire-derive",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.91"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Production dependencies
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.4.2" }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
syn = "3.0.9"

# Tests and tooling only
ic-build = "0.17.3"
ic-host-artifacts = { version = "0.27", default-features = false }
ic-host-fs = { version = "0.27", default-features = false }
ic-host-process = { version = "0.27", default-features = false }
ic-platform = { version = "0.1.12", default-features = false }
ic-testkit = "0.54"
ic-wire = { path = "crates/ic-wire", version = "0.4.2" }
ic-wire-adapter-fixture = { path = "crates/ic-wire-adapter-fixture" }
libfuzzer-sys = "0.4.13"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.canister-evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
