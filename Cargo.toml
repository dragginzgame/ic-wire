[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-benchmarks",
    "crates/ic-wire-derive",
    "crates/ic-wire-endpoint",
    "crates/ic-wire-qualification",
    "examples/endpoint",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Core
# Changelog : releases/core/CHANGELOG.md
ic-wire = { path = "crates/ic-wire", version = "0.13.1" }
ic-wire-benchmarks = { path = "crates/ic-wire-benchmarks", version = "0.13.1" }
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.13.1" }
ic-wire-endpoint-fixture = { path = "examples/endpoint", version = "0.13.1" }
ic-wire-qualification = { path = "crates/ic-wire-qualification", version = "0.13.1" }

# Endpoint
# Changelog : releases/endpoint/CHANGELOG.md
ic-wire-endpoint = { path = "crates/ic-wire-endpoint", version = "0.2.1" }

# Production dependencies
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
ic-platform = { version = "0.15.2", default-features = false }
ic-platform-types = { version = "0.15.1", default-features = false }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }

# Native schema support and qualification
serde_json = "1.0"

# Host proc-macro implementation
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["visit"] }

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
dhat = "0.3.3"
ic-build = { version = "0.73.1", default-features = false }
ic-testkit = { version = "0.75.0", default-features = false }
libfuzzer-sys = "0.4.13"
num-bigint = "0.4"
sha2 = "0.10.9"
stats_alloc = "0.1.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.benchmark-speed]
inherits = "evaluation"
opt-level = 3
