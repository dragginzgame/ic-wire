[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-derive",
    "crates/ic-wire-endpoint",
    "crates/ic-wire-endpoint-macros",
]
exclude = ["qualification"]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Core
# Changelog : releases/core/CHANGELOG.md
ic-wire = { path = "crates/ic-wire", version = "0.22.0" }
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.22.0" }

# Endpoint
# Changelog : releases/endpoint/CHANGELOG.md
ic-wire-endpoint-macros = { path = "crates/ic-wire-endpoint-macros", version = "0.12.2" }

# Production dependencies
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
ic-platform-runtime = { version = "0.22.0", default-features = false }
ic-platform-types = { version = "0.20.0", default-features = false }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }

# Native schema support and qualification
serde_json = "1.0"

# Host proc-macro implementation
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }

toko-tooling = "=0.41.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.benchmark-speed]
inherits = "evaluation"
opt-level = 3
