[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-canister-evaluation",
    "crates/ic-wire-derive",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
candid = "0.10.38"
ic-build = "0.13"
ic-cdk = "0.20.3"
ic-host-artifacts = { version = "0.25", default-features = false }
ic-testkit = "0.50"
ic-wire = { path = "crates/ic-wire", version = "0.3.1" }
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.3.1" }
ic0 = "1.2.0"
libfuzzer-sys = "0.4.13"
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
sha2 = "0.10.9"
syn = { version = "3.0.9", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.canister-evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
