[workspace]
members = ["crates/ic-wire", "crates/ic-wire-canister-evaluation"]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"

[workspace.dependencies]
candid = "0.10.38"
ciborium = "0.2.2"
ic-cdk = "0.20.3"
ic0 = "1.2.0"
ic_principal = { version = "0.1.5", features = ["serde"] }
pocket-ic = "16.1.0"
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
postcard-bindgen = { version = "0.9.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
wasmparser = "0.245.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.canister-evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
