[workspace]
members = ["crates/ic-wire", "crates/ic-wire-derive", "crates/ic-wire-qualification"]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.5.18"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Production dependencies
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.5.18" }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
syn = "3.0.9"

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
ic-build = { version = "0.63", default-features = false }
ic-wire = { path = "crates/ic-wire", version = "0.5.18" }
libfuzzer-sys = "0.4.13"
serde_bytes = "0.11.19"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
