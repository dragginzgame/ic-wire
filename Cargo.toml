[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-derive",
    "crates/ic-wire-endpoint",
    "crates/ic-wire-endpoint-macros",
]
exclude = ["qualification"]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-wire"

[workspace.dependencies]
# Core
# Changelog : releases/core/CHANGELOG.md
ic-wire = { path = "crates/ic-wire", version = "0.21.2" }
ic-wire-derive = { path = "crates/ic-wire-derive", version = "0.21.2" }

# Endpoint
# Changelog : releases/endpoint/CHANGELOG.md
ic-wire-endpoint = { path = "crates/ic-wire-endpoint", version = "0.12.1" }
ic-wire-endpoint-macros = { path = "crates/ic-wire-endpoint-macros", version = "0.12.1" }

# Production dependencies
bytemuck = { version = "1.25.2", default-features = false, features = ["must_cast"] }
ic-platform-runtime = { version = "0.21.0", default-features = false }
ic-platform-types = { version = "0.19.0", default-features = false }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["alloc"] }
serde_bytes = { version = "0.11.19", default-features = false, features = ["alloc"] }

# Native schema support and qualification
serde_json = "1.0"

# Host proc-macro implementation
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"

# Tests and tooling only
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }

toko-tooling = "=0.39.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.benchmark-speed]
inherits = "evaluation"
opt-level = 3
