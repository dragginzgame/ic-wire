[workspace]
members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"

[workspace.dependencies]
candid = "0.10.38"
ciborium = "0.2.2"
ic_principal = { version = "0.1.5", features = ["serde"] }
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
