[workspace]
members = [
    "crates/ic-wire",
    "crates/ic-wire-canister-evaluation",
    "crates/ic-wire-derive",
]
default-members = ["crates/ic-wire"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.91"
license-file = "LICENSE"

[workspace.dependencies]
candid = "0.10.38"
ciborium = "0.2.2"
ic-cdk = "0.20.3"
ic-wire = { path = "crates/ic-wire" }
ic-wire-derive = { path = "crates/ic-wire-derive" }
ic0 = "1.2.0"
ic_principal = { version = "0.1.5", features = ["serde"] }
pocket-ic = "16.1.0"
postcard = { version = "1.1.1", default-features = false, features = ["alloc"] }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
sha2 = "0.10.9"
syn = { version = "2.0.119", features = ["full"] }
wasmparser = "0.245.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.canister-evaluation]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
