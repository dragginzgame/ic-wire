[package]
name = "ic-wire-endpoint-fixture"
version = "0.17.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobenches = false

[package.metadata.shared-tooling.loc]
category = "tests"

[package.metadata.shared-tooling.loc.paths]
benches = "benchmarks"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Select native IC qualification targets; the client is a native dev dependency.
ic = []
schema = ["ic-wire/typescript", "ic-wire-endpoint/typescript"]
# Qualification-only inline hook comparator, never a production encoding mode.
inline-baseline = []
admission-contract = ["dep:ic-wire-qualification"]

[dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-wire.workspace = true
ic-wire-endpoint.workspace = true
ic-wire-qualification = { workspace = true, optional = true, features = ["contract-fixture"] }
serde.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-platform-types = { workspace = true, features = ["principal-external"] }
ic-testkit.workspace = true
ic-wire = { workspace = true, features = ["typescript"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[[test]]
name = "installed"
path = "tests/installed/mod.rs"
required-features = ["ic"]

[[test]]
name = "cost-matrix"
path = "tests/cost_matrix/mod.rs"
required-features = ["ic"]

[[example]]
name = "endpoint-cost"
path = "benches/cost/mod.rs"
crate-type = ["cdylib"]

[lints]
workspace = true
